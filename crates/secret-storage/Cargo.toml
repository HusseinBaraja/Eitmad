[package]
name = "eitmad-secret-storage"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "=0.10.3", features = ["std", "zeroize"] }
eitmad-contracts = { path = "../contracts" }
fs2 = "=0.4.3"
sha2 = "=0.10.9"
uuid = { version = "=1.23.4", features = ["v4"] }
zeroize = { version = "=1.8.1", features = ["std"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "=3.24.0"
