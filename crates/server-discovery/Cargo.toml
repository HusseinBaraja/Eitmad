[package]
name = "eitmad-server-discovery"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
eitmad-contracts = { path = "../contracts" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.49.0", features = ["net", "process", "io-util", "time", "sync", "macros"] }
uuid = { version = "=1.23.4", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.24.0"
tokio = { version = "=1.49.0", features = ["rt", "test-util"] }
