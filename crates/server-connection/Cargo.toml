[package]
name = "eitmad-server-connection"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
eitmad-contracts = { path = "../contracts" }
eitmad-secret-storage = { path = "../secret-storage" }
eitmad-sync = { path = "../sync" }
rustls = "=0.23.43"
semver = "=1.0.27"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
url = "=2.5.4"
uuid = { version = "=1.23.4", features = ["v4"] }
zeroize = "=1.8.1"

[dev-dependencies]
async-trait = "=0.1.89"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
eitmad-control-plane = { path = "../../server/control-plane" }
eitmad-server = { path = "../../server/host" }
eitmad-server-audit = { path = "../../server/audit" }
eitmad-sync-plane = { path = "../../server/sync-plane" }
tempfile = "=3.24.0"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread", "time"] }
