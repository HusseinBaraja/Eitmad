[package]
name = "eitmad-engine-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
eitmad-customer = { path = "../customer" }
eitmad-server-connection = { path = "../server-connection" }
eitmad-secret-storage = { path = "../secret-storage" }
argon2 = "=0.5.3"
clap = { version = "=4.5.54", features = ["derive"] }
eitmad-contracts = { path = "../contracts" }
eitmad-engine-runtime = { path = "../engine-runtime" }
eitmad-observability-audit = { path = "../observability-audit" }
eitmad-storage = { path = "../storage" }
serde = "=1.0.228"
serde_json = "=1.0.150"
tokio = { version = "=1.49.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
uuid = { version = "=1.23.4", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
tempfile = "=3.24.0"
