[package]
name = "eitmad-part"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
eitmad-authorization = { path = "../authorization" }
eitmad-contracts = { path = "../contracts" }
eitmad-observability-audit = { path = "../observability-audit" }
eitmad-storage = { path = "../storage" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
uuid = { version = "=1.23.4", features = ["v4"] }

eitmad-material = { path = "../material" }
num-rational = "=0.4.2"
num-bigint = "=0.4.8"
num-traits = "=0.2.19"

[dev-dependencies]
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
tempfile = "=3.24.0"
