schema_version = 1

[channels]
production = "stable"
staging = "beta"
development = "canary"

[artifacts.windows_desktop]
enabled = true
format = "msix"
runtime = "win-x64"
engine_package = "eitmad-engine-cli"
shell_project = "shells/windows/Eitmad.WindowsShell.csproj"
production_installer = "msix"
update_adapter_status = "not-implemented"
package_identity = "Eitmad.Desktop"
minimum_windows_build = "10.0.19041.0"
self_contained = true

[artifacts.windows_server]
enabled = true
format = "zip"
runtime = "win-x64"
rust_package = "eitmad-server"
postgres_major = 17
service_wrapper = "WinSW 2.12.0 (external prerequisite)"

[artifacts.windows_setup]
enabled = true
format = "zip"
runtime = "win-x64"
shell_project = "shells/windows-setup/Eitmad.WindowsSetup.csproj"
self_contained = true

[artifacts.windows_offline]
enabled = true
format = "zip"
runtime = "win-x64"
launcher = "setup/EitmadSetup.exe"
authenticated_inventory = "offline.cat (SHA-256, trusted publisher, RFC3161 timestamp)"
client_installer = "per-user MSIX Eitmad.Desktop"

[artifacts.windows_installers]
enabled = true
format = "exe"
runtime = "win-x64"
server = "EitmadServerSetup.exe"
client = "EitmadClientSetup.exe"
self_contained = true
embedded_payload = "authenticated role-specific offline archive"
signing_required = true

[artifacts.macos_desktop]
enabled = false
format = "pkg"
production_installer = "pkg"
update_adapter_status = "not-implemented"

[artifacts.linux_desktop]
enabled = false
format = "deb"
additional_formats = ["rpm", "appimage"]
update_adapter_status = "not-implemented"

[artifacts.server]
enabled = true
format = "tar.gz"
runtime = "linux-x64"
rust_package = "eitmad-server"

[integrity]
digest = "sha256"
manifest_signature = "ed25519"
require_immutable_urls = true
