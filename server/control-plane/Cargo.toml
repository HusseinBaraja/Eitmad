[package]
name = "eitmad-control-plane"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "=0.5.3"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
eitmad-contracts = { path = "../../crates/contracts" }
eitmad-server-audit = { path = "../audit" }
hmac = "=0.12.1"
rand = "=0.9.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
sqlx = { package = "eitmad-postgres-support", path = "../postgres-support" }
thiserror = "=2.0.18"
tokio = { version = "=1.49.0", features = ["rt", "sync"] }
unicode-normalization = "=0.1.25"
uuid = { version = "=1.23.4", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "eitmad-control-plane"
path = "src/main.rs"
test = false

