name: Mandatory validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Base revision used for policy comparisons
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mandatory-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1
  # Keep test/build output small enough to restore quickly; runtime checks stay enabled.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Enforce ownership, safety, migrations, Arabic, and documentation impact
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          python scripts/ci/check_repository_policy.py --base "$BASE_SHA"
      - name: Test repository policy rules
        run: python -m unittest discover -s scripts/ci/tests -v
      - name: Audit documentation metadata, dates, placeholders, headings, and links
        run: python .agents/skills/maintain-project-documentation/scripts/audit_docs.py --root docs

  rust-quality:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: clippy,rustfmt
      - uses: actions/cache/restore@v4
        id: rust-build-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/debug
            target/.rustc_info.json
            artifacts/rust-source-mtimes.json
          key: ${{ runner.os }}-rust-quality-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-quality-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-rust-quality-v1-
      - name: Restore timestamps only for identical source inputs
        run: python scripts/ci/cache_source_mtimes.py restore artifacts/rust-source-mtimes.json
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-nextest@0.9.150
          fallback: none
      - name: Check Rust formatting
        if: matrix.partition == 1
        run: cargo fmt --all -- --check
      # Clippy checks compilation with this pinned minimum toolchain as well as lints.
      - name: Check minimum-version compilation and reject Rust warnings
        if: matrix.partition == 1
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test contracts, IPC, migrations, authorization, isolation, redaction, secrets, sync, and updates
        run: cargo nextest run --locked --workspace --profile ci --partition count:${{ matrix.partition }}/3
      - name: Verify native Windows credential storage
        if: matrix.partition == 1
        run: cargo nextest run --locked --workspace --profile native-credentials --run-ignored only -E 'package(eitmad-secret-storage) & test(os_native_backend_supports_secret_lifecycle)'
      - name: Test Rust documentation examples
        if: matrix.partition == 1
        run: cargo test --locked --workspace --doc
      - name: Record compiler source timestamps
        if: always() && matrix.partition == 1
        run: python scripts/ci/cache_source_mtimes.py save artifacts/rust-source-mtimes.json
      - uses: actions/cache/save@v4
        if: always() && matrix.partition == 1 && steps.rust-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/debug
            target/.rustc_info.json
            artifacts/rust-source-mtimes.json
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-test-timings-${{ matrix.partition }}
          path: target/nextest/**/junit.xml
          if-no-files-found: warn

  contracts-and-ipc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: contracts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/contracts/codegen/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-8-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-8-
      - run: npm ci --ignore-scripts --prefix crates/contracts/codegen
      - name: Reject high-severity contract tool vulnerabilities
        run: npm audit --audit-level=high --prefix crates/contracts/codegen
      - name: Reject contract, fixture, reference, and generated-binding drift
        run: npm run contracts:verify --prefix crates/contracts/codegen
      - name: Validate C# binding compatibility and Arabic round trips
        run: >-
          dotnet run
          --project tests/contract-compatibility/csharp/Eitmad.ContractConformance.csproj
          --configuration Release
          -- tests/contract-compatibility/fixtures/protocol-v1.json
      # Rust IPC and engine lifecycle tests run in rust-quality's full workspace suite.

  windows-desktop:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-8-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-8-
      - name: Build Windows shell with warnings rejected
        if: matrix.partition == 3
        run: dotnet build shells/windows/Eitmad.WindowsShell.csproj --configuration Release --nologo
      - name: Test Arabic, RTL, and presentation lifecycle
        run: pwsh -NoProfile -File scripts/ci/test_windows_shell.ps1 -Partition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shell-tests-${{ matrix.partition }}
          path: artifacts/windows-shell-tests/*.trx
          if-no-files-found: warn

  windows-supervision:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: windows-supervision
          cache-workspace-crates: true
          cache-on-failure: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-8-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-8-
      - name: Build engine
        run: cargo build --locked -p eitmad-engine-cli
      - name: Smoke-test engine diagnostics
        run: ./target/debug/eitmad-engine-cli.exe diagnose
      - name: Test fake and real-engine process supervision
        run: >-
          dotnet run
          --project platform-adapters/windows/tests/Eitmad.Platform.Windows.Tests.csproj
          --configuration Release
          --
          --engine target/debug/eitmad-engine-cli.exe

  macos-bindings:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile Swift binding conformance
        run: >-
          swiftc
          shells/macos/generated/EitmadContracts.generated.swift
          shells/macos/generated/EitmadContractsUnions.generated.swift
          shells/macos/generated/ProtocolIds.generated.swift
          tests/contract-compatibility/swift/ContractFixtureTests.swift
          -o "$RUNNER_TEMP/eitmad-contract-tests"
      - name: Validate Swift compatibility and Arabic round trips
        run: >-
          "$RUNNER_TEMP/eitmad-contract-tests"
          tests/contract-compatibility/fixtures/protocol-v1.json

  server-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: server-smoke
          cache-workspace-crates: true
      - name: Preserve Linux contract lint and test coverage
        run: |
          cargo clippy --locked -p eitmad-contracts --all-targets -- -D warnings
          cargo test --locked -p eitmad-contracts
      - name: Build server with locked dependencies
        run: cargo build --locked -p eitmad-server
      - name: Check server CLI
        run: cargo run --locked -q -p eitmad-server -- --help
      - name: Check redacted loopback configuration
        env:
          EITMAD_SERVER_DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1/eitmad_ci
          EITMAD_SERVER_TOKEN_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          EITMAD_SERVER_LISTEN: 127.0.0.1:8443
          EITMAD_SERVER_ALLOW_INSECURE_LOOPBACK: "true"
          EITMAD_SERVER_UPDATE_MANIFEST_DIRECTORY: ${{ runner.temp }}/manifests
          EITMAD_SERVER_UPDATE_OPERATOR_TENANT_ID: 00000000-0000-0000-0000-000000000001
          EITMAD_SERVER_UPDATE_KEY_ID: synthetic-ci-key
          EITMAD_SERVER_UPDATE_PUBLIC_KEY: 11qYAYKxCrfVS/7TyWQHOg7hcvPpapC1HApkqfJcGgE=
        run: |
          mkdir -p "$EITMAD_SERVER_UPDATE_MANIFEST_DIRECTORY"
          cargo run --locked -q -p eitmad-server -- check-config

  package-windows:
    runs-on: windows-latest
    env:
      # Parallel LLVM work for unsigned CI artifacts; keep full optimization and ThinLTO.
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    strategy:
      fail-fast: false
      matrix:
        target: [windows-desktop, windows-server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/cache/restore@v4
        id: rust-build-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/toolchain-1.85.1/release
            target/toolchain-1.85.1/.rustc_info.json
            artifacts/rust-source-mtimes.json
          key: ${{ runner.os }}-package-${{ matrix.target }}-cgu16-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-package-${{ matrix.target }}-cgu16-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-package-${{ matrix.target }}-cgu16-v1-
      - name: Restore timestamps only for identical source inputs
        run: python scripts/ci/cache_source_mtimes.py restore artifacts/rust-source-mtimes.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-8-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-8-
      - name: Verify Windows package and retained service lifecycle tools
        if: matrix.target == 'windows-desktop'
        run: |
          powershell -NoProfile -File deploy/windows/test-package.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File deploy/windows/test-host.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File deploy/windows/test-installation.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File deploy/windows/test-setup-diagnostics.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File deploy/windows/test-release-lifecycle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build repeatable unsigned Windows installation bundle
        run: python scripts/release/build_artifacts.py ${{ matrix.target }} --version 0.0.0-ci --output dist
      - name: Record compiler source timestamps
        if: always()
        run: python scripts/ci/cache_source_mtimes.py save artifacts/rust-source-mtimes.json
      - uses: actions/cache/save@v4
        if: always() && steps.rust-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/toolchain-1.85.1/release
            target/toolchain-1.85.1/.rustc_info.json
            artifacts/rust-source-mtimes.json
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  package-server:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.1
      - uses: actions/cache/restore@v4
        id: rust-build-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/toolchain-1.85.1/release
            target/toolchain-1.85.1/.rustc_info.json
            artifacts/rust-source-mtimes.json
          key: ${{ runner.os }}-package-server-cgu16-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-package-server-cgu16-v1-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
            ${{ runner.os }}-package-server-cgu16-v1-
      - name: Restore timestamps only for identical source inputs
        run: python scripts/ci/cache_source_mtimes.py restore artifacts/rust-source-mtimes.json
      - name: Build repeatable unsigned server validation bundle
        env:
          SOURCE_DATE_EPOCH: 1577836800
        run: python scripts/release/build_artifacts.py server --version 0.0.0-ci --output dist
      - name: Record compiler source timestamps
        if: always()
        run: python scripts/ci/cache_source_mtimes.py save artifacts/rust-source-mtimes.json
      - uses: actions/cache/save@v4
        if: always() && steps.rust-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/toolchain-1.85.1/release
            target/toolchain-1.85.1/.rustc_info.json
            artifacts/rust-source-mtimes.json
          key: ${{ steps.rust-build-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-validation-package
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  validation-complete:
    if: always()
    needs:
      - repository-policy
      - rust-quality
      - contracts-and-ipc
      - windows-desktop
      - windows-supervision
      - macos-bindings
      - server-smoke
      - package-windows
      - package-server
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation gate
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = "success,success,success,success,success,success,success,success,success"
